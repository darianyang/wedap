[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wedap"
version = "1.1.0"
description = "Weighted Ensemble Data Analysis and Plotting"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Darian T. Yang", email = "dty7@pitt.edu" }
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.7", "h5py", "gif", "tqdm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry"
]

[tool.setuptools.packages.find]
# only ship the three real packages (and their subpackages); this also keeps the
# redundant top-level styles/ dir and docs/ out of the installed distribution
include = ["wedap*", "mdap*", "wekap*"]

[tool.setuptools.package-data]
"wedap" = ["styles/*"]
"mdap" = ["styles/*"]
"wekap" = ["styles/*"]

[tool.pytest.ini_options]
filterwarnings = "ignore::UserWarning"

[project.urls]
"Source" = "https://github.com/darianyang/wedap"
"Documentation" = "https://darianyang.github.io/wedap"

[project.scripts]
wedap = "wedap.__main__:main"
mdap = "mdap.__main__:main"
wekap = "wekap.__main__:main"